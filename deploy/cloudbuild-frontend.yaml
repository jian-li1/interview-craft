# Builds the frontend image with NEXT_PUBLIC_* baked in as build args.
# Invoked by deploy/deploy.sh with substitutions.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/interviewcraft/frontend:latest
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=$_API_URL
      - --build-arg
      - NEXT_PUBLIC_WS_BASE_URL=$_WS_URL
      - --build-arg
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=$_GOOGLE_CLIENT_ID
      - .
images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/interviewcraft/frontend:latest
substitutions:
  _REGION: us-central1
  _API_URL: ""
  _WS_URL: ""
  _GOOGLE_CLIENT_ID: ""
